<!doctype html><html><head><meta charset="utf-8"><title>Apex Client</title>
<style>
:root{--bg:#080c16;--panel:#101626;--line:#1f2a44;--text:#ece9f5;--dim:#8d86a3;--acc:#1e7bff;--go:#1e7bff}
*{box-sizing:border-box;margin:0}
body{background:radial-gradient(900px 500px at 20% 0,#102447 0,var(--bg) 60%);color:var(--text);font:14px 'Segoe UI',system-ui,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
#bar{-webkit-app-region:drag;display:flex;justify-content:space-between;align-items:center;padding:10px 16px;color:var(--dim)}
#bar b{color:var(--text);letter-spacing:.5px}
#bar span{-webkit-app-region:no-drag;cursor:pointer;margin-left:14px}
main{flex:1;display:flex;gap:14px;padding:0 16px 16px;min-height:0}
nav{width:60px;background:var(--panel);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px 0}
nav button{width:40px;height:40px;border:0;border-radius:12px;background:none;color:var(--dim);font-size:18px;cursor:pointer}
nav button.on{background:var(--acc);color:#fff}
section{flex:1;display:none;flex-direction:column;gap:14px;min-width:0}section.on{display:flex}
.hero{background:linear-gradient(135deg,#13213f,#0e1a30);border:1px solid var(--line);border-radius:18px;padding:28px;flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:14px}
.hero h1{font-size:34px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
select,input{background:#0b101c;border:1px solid var(--line);color:var(--text);padding:9px 12px;border-radius:10px;font:inherit}
input{flex:1;min-width:160px}
.go{background:var(--go);color:#fff;font-weight:700;border:0;border-radius:12px;padding:14px 38px;font-size:16px;cursor:pointer}
.go:disabled{opacity:.5}
.btn{background:var(--acc);border:0;color:#fff;border-radius:10px;padding:8px 14px;cursor:pointer}
#prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden}#prog i{display:block;height:100%;width:0;background:var(--go)}
#list{overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;align-content:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;gap:12px}
.card img{width:52px;height:52px;border-radius:10px;background:#0b101c;flex:none}
.card p{color:var(--dim);font-size:12.5px;margin:3px 0 8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);padding:10px 18px;border-radius:12px;display:none}
</style></head><body>
<div id="bar"><b style="display:flex;align-items:center;gap:8px"><img src="logo.png" height="26">Apex Client</b><div><span onclick="api.win('min')">–</span><span onclick="api.win('close')">✕</span></div></div>
<main>
<nav><button class="on" data-t="home" title="Play">▶</button><button data-t="mods" title="Mods">⬢</button><button data-t="resourcepack" title="Texture packs">▦</button><button data-t="shader" title="Shaders">✦</button></nav>

<section id="home" class="on">
  <div class="hero">
    <h1 id="title">Minecraft 1.20.1</h1>
    <div class="row">
      <select id="ver"><option>Loading…</option></select>
      <select id="loader"><option value="fabric">Fabric</option><option value="vanilla">Vanilla</option></select>
      <select id="ram"><option>2</option><option selected>4</option><option>6</option><option>8</option></select><span style="color:var(--dim)">GB RAM</span>
    </div>
    <div id="prog"><i></i></div>
    <div class="row"><button class="go" id="play">LAUNCH</button><button class="btn" id="login">Sign in with Microsoft</button><span id="user" style="color:var(--dim)"></span></div>
  </div>
</section>

<section id="browse">
  <div class="row"><input id="q" placeholder="Search Modrinth…"><button class="btn" id="s">Search</button></div>
  <div id="list"></div>
</section>
</main><div id="toast"></div>
<script>
const $=s=>document.querySelector(s); let tab='home';
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._);t._=setTimeout(()=>t.style.display='none',3500)};
const cfg=()=>({version:$('#ver').value,loader:$('#loader').value,ram:$('#ram').value});
$('#ver').onchange=()=>$('#title').textContent='Minecraft '+$('#ver').value;
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
  tab=b.dataset.t;$('#home').classList.toggle('on',tab==='home');$('#browse').classList.toggle('on',tab!=='home');
  if(tab!=='home')search();
});
$('#login').onclick=async()=>{try{const u=await api.login();$('#user').textContent='Signed in as '+u.name;$('#login').style.display='none'}catch(e){toast('Sign-in failed: '+e.message)}};
$('#play').onclick=async()=>{$('#play').disabled=true;try{await api.launch(cfg())}catch(e){toast(e.message);$('#play').disabled=false}};
api.on('progress',p=>$('#prog i').style.width=(p.task/p.total*100)+'%');
api.on('closed',()=>{$('#play').disabled=false;$('#prog i').style.width=0});
async function search(){
  const {version,loader}=cfg(); $('#list').innerHTML='';
  const kind=tab==='mods'?'mod':tab;
  try{const hits=await api.search({query:$('#q').value,kind,version,loader});
    $('#list').innerHTML=hits.map(h=>`<div class="card"><img src="${h.icon||''}"><div><b>${h.title}</b> <small style="color:var(--dim)">by ${h.author}</small><p>${h.desc}</p><button class="btn" data-id="${h.id}">Install</button></div></div>`).join('')||'<p style="color:var(--dim)">Nothing found for this version. Try another search or version.</p>';
    $('#list').querySelectorAll('button').forEach(b=>b.onclick=async()=>{b.disabled=true;b.textContent='Installing…';
      try{const f=await api.install({id:b.dataset.id,kind,version,loader});b.textContent='Installed';toast('Saved '+f)}catch(e){b.textContent='Install';b.disabled=false;toast(e.message)}});
  }catch(e){toast('Search failed: '+e.message)}
}
api.on('notice',toast);
api.versions().then(v=>{$('#ver').innerHTML=v.map(x=>`<option>${x}</option>`).join('');$('#title').textContent='Minecraft '+v[0]});
$('#s').onclick=search;$('#q').onkeydown=e=>e.key==='Enter'&&search();
</script></body></html>
