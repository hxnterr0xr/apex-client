<!doctype html><html><head><meta charset="utf-8"><title>Apex Client</title>
<style>
:root{--bg:#060a14;--panel:#0d1424;--line:#1c2745;--text:#eaf0ff;--dim:#7c8aa8;--acc:#1e7bff}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font:14px 'Segoe UI Variable','Segoe UI',system-ui,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
#bar{-webkit-app-region:drag;display:flex;justify-content:space-between;align-items:center;padding:10px 16px;color:var(--dim)}
#bar b{color:var(--text);display:flex;align-items:center;gap:8px;font-size:15px}#bar small{font-weight:400;color:var(--dim)}
#bar span{-webkit-app-region:no-drag;cursor:pointer;margin-left:16px;font-size:16px}
main{flex:1;display:flex;gap:14px;padding:0 16px 16px;min-height:0}
nav{width:196px;background:var(--panel);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;gap:4px;padding:12px}
nav button{display:flex;align-items:center;gap:12px;border:0;border-radius:12px;background:none;color:var(--dim);font:inherit;font-size:15px;padding:12px 14px;cursor:pointer;text-align:left}
nav button:hover{color:var(--text);background:#121b32}nav button.on{background:#12203f;color:#fff;box-shadow:inset 0 0 0 1px var(--acc)}
section{flex:1;display:none;flex-direction:column;gap:14px;min-width:0}section.on{display:flex}
.stage{position:relative;flex:1;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:center/cover}
#scene{position:absolute;inset:0;width:100%;height:100%}
.center{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.center img{height:min(260px,34vh)}
#title{color:#b9c8e6;font-size:15px;margin-top:-6px}
.go{width:420px;background:linear-gradient(#2a86ff,#1566e0);color:#fff;font-weight:700;border:0;border-radius:12px;padding:16px;font-size:17px;cursor:pointer;box-shadow:0 8px 30px #1e7bff55}
.go:hover{filter:brightness(1.1)}.go:disabled{opacity:.55;cursor:default}
.glass{background:#0a1226cc;border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(8px)}
.opts{display:flex;gap:8px;align-items:center;padding:8px 10px;color:var(--dim);width:420px;justify-content:center}
select,input{background:#0b101c;border:1px solid var(--line);color:var(--text);padding:9px 12px;border-radius:10px;font:inherit}
#prog{width:420px;height:5px;background:#16203a;border-radius:3px;overflow:hidden}#prog i{display:block;height:100%;width:0;background:var(--acc)}
.chip{position:absolute;top:16px;left:16px;display:flex;align-items:center;gap:10px;padding:8px 12px}
.chip i{width:8px;height:8px;border-radius:2px;background:var(--acc)}
.btn{background:var(--acc);border:0;color:#fff;border-radius:10px;padding:8px 14px;cursor:pointer;font:inherit}
.news{position:absolute;right:16px;bottom:16px;width:260px;padding:14px}.news b{display:block;margin-bottom:6px}.news p{color:#b9c8e6;font-size:13px;margin-top:4px}
#browse h2{font-size:20px}
.row{display:flex;gap:10px;align-items:center}input{flex:1}
#list{overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;align-content:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;gap:12px}
.card img{width:52px;height:52px;border-radius:10px;background:#0b101c;flex:none}
.card p{color:var(--dim);font-size:12.5px;margin:3px 0 8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);padding:10px 18px;border-radius:12px;display:none}
</style></head><body>
<div id="bar"><b><img src="logo.png" height="26">Apex Client <small>v1.0.0</small></b><div><span onclick="api.win('min')">–</span><span onclick="api.win('close')">✕</span></div></div>
<main>
<nav><button class="on" data-t="home">▶ Home</button><button data-t="mods">⬢ Mods</button><button data-t="resourcepack">▦ Texture packs</button><button data-t="shader">✦ Shaders</button></nav>

<section id="home" class="on"><div class="stage" id="stage"><canvas id="scene"></canvas>
  <div class="chip glass"><i></i><span id="user">Not signed in</span><button class="btn" id="login">Sign in</button><button class="btn" id="logs" style="background:#16203a">Logs</button></div>
  <div class="center">
    <img src="logo.png" alt="Apex Client"><div id="title">Minecraft</div>
    <button class="go" id="play">LAUNCH</button>
    <div id="prog"><i></i></div>
    <div class="opts glass"><select id="ver"><option>Loading…</option></select>
      <select id="loader"><option value="fabric">Fabric</option><option value="vanilla">Vanilla</option></select>
      <select id="ram"><option>2</option><option selected>4</option><option>6</option><option>8</option></select>GB RAM</div>
  </div>
  <div class="news glass"><b>What's new</b><p>Apex HUD on 1.20.1 and 1.21.11</p><p>New Apex main menu in game</p></div>
</div></section>

<section id="browse"><h2 id="bt"></h2><div class="row"><input id="q" placeholder="Search Modrinth…"><button class="btn" id="s">Search</button></div><div id="list"></div></section>
</main><div id="toast"></div>
<script>
const $=s=>document.querySelector(s); let tab='home';
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._);t._=setTimeout(()=>t.style.display='none',3500)};
const cfg=()=>({version:$('#ver').value,loader:$('#loader').value,ram:$('#ram').value});
const names={mods:'Mods',resourcepack:'Texture packs',shader:'Shaders'};
// Night scene drawn in code. To use your own art, put background.png next to index.html.
function scene(){const c=$('#scene'),r=c.parentElement.getBoundingClientRect(),w=c.width=r.width,h=c.height=r.height,x=c.getContext('2d');
 let g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'#02040c');g.addColorStop(.6,'#0a1a3c');g.addColorStop(1,'#0d2a52');x.fillStyle=g;x.fillRect(0,0,w,h);
 let s=7;const rnd=()=>(s=(s*16807)%2147483647)/2147483647;
 for(let i=0;i<170;i++){x.fillStyle=`rgba(255,255,255,${.25+rnd()*.6})`;const z=rnd()<.15?3:2;x.fillRect(Math.floor(rnd()*w),Math.floor(rnd()*h*.55),z,z)}
 const mx=w*.78,my=h*.12;x.shadowColor='#8fb8ff';x.shadowBlur=60;x.fillStyle='#cfe0ff';x.fillRect(mx,my,56,56);x.shadowBlur=0;x.fillStyle='#a9c4f5';[[8,8],[32,16],[16,36],[38,38]].forEach(([a,b])=>x.fillRect(mx+a,my+b,14,12));
 const hz=h*.68;
 [['#0c1a38',70,.9],['#0a1f2e',50,1.7],['#06120f',36,2.6]].forEach(([col,amp,f],i)=>{x.fillStyle=col;for(let px=0;px<w;px+=16){const n=Math.sin(px/(180/f)+i*2)+Math.sin(px/(75/f)+i)*.5;const top=Math.floor((hz-20*i-amp*(.6+n*.4))/16)*16;x.fillRect(px,top,16,hz-top+40)}});
 g=x.createLinearGradient(0,hz,0,h);g.addColorStop(0,'#0a2248');g.addColorStop(1,'#050c1c');x.fillStyle=g;x.fillRect(0,hz,w,h-hz);
 x.fillStyle='rgba(207,224,255,.18)';for(let y=hz+6;y<h;y+=10)x.fillRect(mx+8+Math.sin(y)*6,y,Math.max(8,40-(y-hz)/12),3);
 g=x.createRadialGradient(w/2,h*.45,40,w/2,h*.45,w*.6);g.addColorStop(0,'rgba(2,6,16,0)');g.addColorStop(1,'rgba(2,6,16,.55)');x.fillStyle=g;x.fillRect(0,0,w,h)}
const bg=new Image();bg.onload=()=>{$('#scene').style.display='none';$('#stage').style.backgroundImage="url(background.png)"};bg.onerror=()=>{scene();addEventListener('resize',scene)};bg.src='background.png';

$('#ver').onchange=()=>{const v=$('#ver').value;$('#title').textContent='Minecraft '+v;if(v.startsWith('1.')&&+v.split('.')[1]<14){$('#loader').value='vanilla';toast('Fabric starts at 1.14, so this version launches as vanilla.')}};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
  tab=b.dataset.t;$('#home').classList.toggle('on',tab==='home');$('#browse').classList.toggle('on',tab!=='home');
  if(tab==='home')setTimeout(()=>$('#scene').style.display!=='none'&&scene(),0);else{$('#bt').textContent=names[tab];search()}
});
$('#login').onclick=async()=>{try{const u=await api.login();$('#user').textContent=u.name;$('#login').style.display='none'}catch(e){toast('Sign-in failed: '+e.message)}};
$('#play').onclick=async()=>{$('#play').disabled=true;try{await api.launch(cfg())}catch(e){toast(e.message);$('#play').disabled=false}};
api.on('progress',p=>$('#prog i').style.width=(p.task/p.total*100)+'%');
api.on('closed',c=>{$('#play').disabled=false;$('#prog i').style.width=0;if(c)toast('Game stopped (code '+c+'). Press Logs to see why.')});
$('#logs').onclick=()=>api.openlog();
async function search(){
  const {version,loader}=cfg(); $('#list').innerHTML='';
  const kind=tab==='mods'?'mod':tab;
  try{const hits=await api.search({query:$('#q').value,kind,version,loader});
    $('#list').innerHTML=hits.map(h=>`<div class="card"><img src="${h.icon||''}"><div><b>${h.title}</b> <small style="color:var(--dim)">by ${h.author}</small><p>${h.desc}</p><button class="btn" data-id="${h.id}">Install</button></div></div>`).join('')||'<p style="color:var(--dim)">Nothing found for this version. Try another search or version.</p>';
    $('#list').querySelectorAll('button').forEach(b=>b.onclick=async()=>{b.disabled=true;b.textContent='Installing…';
      try{const f=await api.install({id:b.dataset.id,kind,version,loader});b.textContent='Installed';toast('Saved '+f)}catch(e){b.textContent='Install';b.disabled=false;toast(e.message)}});
  }catch(e){toast('Search failed: '+e.message)}
}
api.on('notice',toast);
api.versions().then(v=>{$('#ver').innerHTML=v.map(x=>`<option>${x}</option>`).join('');$('#title').textContent='Minecraft '+v[0]});
$('#s').onclick=search;$('#q').onkeydown=e=>e.key==='Enter'&&search();
</script></body></html>
